
name: HRMS Staging - CI/CD Deployment

on:
  push:
    branches:
      - staging

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrms-staging-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: hrms-backend-staging
  TARGET_REPO: zaltixsoftsolutions205/hrms-backend
  CONTAINER_NAME: hrms-staging

jobs:

  # ==========================================
  # JOB 1: SYNC BACKEND REPOSITORY
  # ==========================================

  sync-backend-repo:

    name: Sync Backend Repository
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Backend Directory
        run: |
          test -d backend || {
            echo "Backend directory not found"
            exit 1
          }

          test -f backend/Dockerfile || {
            echo "Dockerfile not found inside backend/"
            exit 1
          }

      - name: Configure Git
        run: |
          git config --global user.email \
            "ci@zaltixsoftsolutions.com"

          git config --global user.name "Zaltix CI"

      - name: Sync Backend to Staging Branch
        env:
          HRMS_BACKEND_TOKEN: ${{ secrets.HRMS_BACKEND_TOKEN }}
        run: |
          set -e

          git clone \
            https://x-access-token:${HRMS_BACKEND_TOKEN}@github.com/${TARGET_REPO}.git \
            /tmp/hrms-backend

          cd /tmp/hrms-backend

          git fetch origin

          if git show-ref --verify --quiet refs/remotes/origin/staging; then
            git checkout -B staging origin/staging
          else
            git checkout -B staging origin/main
          fi

          # Synchronize backend contents.
          # Never copy environment secrets into Git.

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            "$GITHUB_WORKSPACE/backend/" \
            /tmp/hrms-backend/

          git add -A

          if git diff --cached --quiet; then
            echo "No backend changes to sync."
          else
            git commit -m "staging: sync backend from zaltix-hrms @ ${GITHUB_SHA}"
          fi

          git push origin staging

          echo "Backend synchronization completed."

  # ==========================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  # ==========================================

  build-and-push:

    name: Build and Push Staging Image
    runs-on: ubuntu-latest

    needs: sync-backend-repo

    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.image-info.outputs.image_tag }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials - OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Verify ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region $AWS_REGION

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Checkout Synchronized Backend
        env:
          HRMS_BACKEND_TOKEN: ${{ secrets.HRMS_BACKEND_TOKEN }}
        run: |
          git clone \
            --branch staging \
            https://x-access-token:${HRMS_BACKEND_TOKEN}@github.com/${TARGET_REPO}.git \
            /tmp/hrms-backend

      - name: Build and Push Docker Image
        id: image-info
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          IMAGE_TAG="${GITHUB_SHA}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          docker build \
            --pull \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            /tmp/hrms-backend

          docker push "${IMAGE_URI}:${IMAGE_TAG}"

          docker push "${IMAGE_URI}:latest"

          echo "Image successfully pushed:"
          echo "${IMAGE_URI}:${IMAGE_TAG}"

      - name: Verify Image in ECR
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=${GITHUB_SHA} \
            --region $AWS_REGION

  # ==========================================
  # JOB 3: DEPLOY TO STAGING EC2
  # ==========================================

  deploy-staging:

    name: Deploy to HRMS Staging EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Nginx Upload Configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          source: nginx-upload.conf
          target: /tmp/

      - name: Deploy to Staging EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          envs: AWS_ACCOUNT_ID,IMAGE_TAG
          script: |
            set -Eeuo pipefail

            AWS_REGION=ap-south-2

            ECR_REPOSITORY=hrms-backend-staging

            CONTAINER_NAME=hrms-staging

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

            NEW_IMAGE="${IMAGE_URI}:${IMAGE_TAG}"

            ENV_FILE="/opt/hrms-staging/backend/.env"

            UPLOAD_DIR="/opt/hrms-staging/uploads"

            echo "=================================="
            echo "HRMS STAGING DEPLOYMENT"
            echo "=================================="

            # Validate staging environment file

            if [ ! -f "$ENV_FILE" ]; then
              echo "Staging environment file missing!"
              exit 1
            fi

            # Ensure directories exist

            sudo mkdir -p "$UPLOAD_DIR"

            sudo mkdir -p /opt/hrms-staging/backend

            # Verify Docker and AWS identity

            docker info >/dev/null

            aws sts get-caller-identity

            # Login to private ECR

            aws ecr get-login-password \
              --region "$AWS_REGION" \
              | docker login \
                --username AWS \
                --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            # Pull the exact commit image

            echo "Pulling image: $NEW_IMAGE"

            docker pull "$NEW_IMAGE"

            # Remember the previous image for rollback

            OLD_IMAGE=""

            if docker inspect "$CONTAINER_NAME" >/dev/null 2>&1; then

              OLD_IMAGE=$(docker inspect \
                --format='{{.Config.Image}}' \
                "$CONTAINER_NAME")

              echo "Previous image: $OLD_IMAGE"

              docker stop "$CONTAINER_NAME"

              docker rm "$CONTAINER_NAME"

            fi

            # Apply upload directory ownership.
            # UID 1001 must match the Dockerfile user.

            sudo chown -R 1001:1001 "$UPLOAD_DIR"

            # Start new staging container

            echo "Starting new staging container..."

            if ! docker run -d \
              --name "$CONTAINER_NAME" \
              -p 127.0.0.1:5000:5000 \
              --env-file "$ENV_FILE" \
              -v "$UPLOAD_DIR:/app/uploads" \
              --restart unless-stopped \
              "$NEW_IMAGE"; then

              echo "New container failed to start."

              if [ -n "$OLD_IMAGE" ]; then

                docker rm -f "$CONTAINER_NAME" || true

                docker run -d \
                  --name "$CONTAINER_NAME" \
                  -p 127.0.0.1:5000:5000 \
                  --env-file "$ENV_FILE" \
                  -v "$UPLOAD_DIR:/app/uploads" \
                  --restart unless-stopped \
                  "$OLD_IMAGE"

                echo "Previous container image restored."

              fi

              exit 1
            fi

            # Allow application initialization

            sleep 10

            # Verify container state

            if [ "$(docker inspect \
              --format='{{.State.Running}}' \
              "$CONTAINER_NAME")" != "true" ]; then

              echo "New container is not running."

              docker logs "$CONTAINER_NAME" || true

              docker rm -f "$CONTAINER_NAME" || true

              if [ -n "$OLD_IMAGE" ]; then

                docker run -d \
                  --name "$CONTAINER_NAME" \
                  -p 127.0.0.1:5000:5000 \
                  --env-file "$ENV_FILE" \
                  -v "$UPLOAD_DIR:/app/uploads" \
                  --restart unless-stopped \
                  "$OLD_IMAGE"

                echo "Rollback completed."

              fi

              exit 1
            fi

            # Apply Nginx upload configuration

            if [ -f /tmp/nginx-upload.conf ]; then

              sudo cp /tmp/nginx-upload.conf \
                /etc/nginx/conf.d/upload-limit.conf

              sudo nginx -t

              sudo systemctl reload nginx

            fi

            # Display deployment details

            echo "=================================="
            echo "STAGING DEPLOYMENT COMPLETED"
            echo "=================================="

            docker ps

            echo "Deployed image: $NEW_IMAGE"

            echo "Environment: $ENV_FILE"

            echo "Uploads: $UPLOAD_DIR"

            echo "Region: $AWS_REGION"

      - name: Deployment Summary
        if: success()
        run: |
          echo "HRMS staging deployment successful."
          echo "Region: ap-south-2"
          echo "Image tag: ${{ needs.build-and-push.outputs.image_tag }}"
